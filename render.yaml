# Render.com Blueprint — deploys AI Shield backend + web app with one click.
# Push this repo to GitHub, then in Render: New + → Blueprint → pick the repo.
services:
  - type: web
    name: aishield
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        sync: false        # set this in the Render dashboard (any long random string)
      - key: PORT
        value: 3000
    disk:
      name: aishield-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
