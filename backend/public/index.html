<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Shield - Config Admin</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #0f1117; color: #e5e7eb; margin: 0; padding: 32px; }
  h1 { font-size: 22px; } .muted { color: #9ca3af; font-size: 13px; }
  .card { background: #171a23; border: 1px solid #2a2f3d; border-radius: 14px; padding: 20px; max-width: 720px; margin-top: 20px; }
  label { display: block; margin-top: 14px; font-size: 13px; color: #9ca3af; }
  input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 10px; border-radius: 8px; border: 1px solid #2a2f3d; background: #0f1117; color: #e5e7eb; font-size: 14px; }
  button { margin-top: 18px; padding: 10px 18px; border-radius: 8px; border: 0; background: #4f46e5; color: white; font-size: 14px; cursor: pointer; }
  button:hover { background: #6366f1; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  pre { background: #0f1117; border: 1px solid #2a2f3d; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
  #msg { margin-top: 10px; font-size: 13px; color: #34d399; }
  #msg.err { color: #f87171; }
</style>
</head>
<body>
<h1>🛡️ AI Shield — Config Admin</h1>
<p class="muted">Edit thresholds here; every phone running the app picks them up within one session (or on refresh). Default admin key: <code>dev-admin-key</code></p>

<div class="card">
  <div class="row">
    <div><label>Alert threshold (show warning ≥)</label><input id="alertThreshold" type="number" step="0.01" min="0.5" max="1" /></div>
    <div><label>Silent-log threshold (record internally ≥)</label><input id="logThreshold" type="number" step="0.01" min="0.1" max="1" /></div>
  </div>
  <div class="row">
    <div><label>Sample interval (ms between analyses)</label><input id="sampleIntervalMs" type="number" step="100" min="300" max="60000" /></div>
    <div><label>Overlay auto-dismiss (ms)</label><input id="overlayAutoDismissMs" type="number" step="500" min="1500" max="60000" /></div>
  </div>
  <div class="row">
    <div><label>Overlay position</label><input id="overlayPosition" placeholder="top | bottom" /></div>
    <div><label>Session auto-stop (minutes, 0 = off)</label><input id="sessionTimeoutMin" type="number" min="0" max="720" /></div>
  </div>
  <button onclick="save()">Save config</button>
  <div id="msg"></div>
</div>

<div class="card">
  <h3 style="margin:0 0 10px 0; font-size:15px;">Current server config (GET /config)</h3>
  <pre id="current">loading…</pre>
</div>

<div class="card">
  <h3 style="margin:0 0 10px 0; font-size:15px;">Admin key</h3>
  <input id="adminKey" value="dev-admin-key" />
</div>

<script>
async function load() {
  const res = await fetch('/config');
  const cfg = await res.json();
  document.getElementById('current').textContent = JSON.stringify(cfg, null, 2);
  for (const k of ['alertThreshold','logThreshold','sampleIntervalMs','overlayAutoDismissMs','sessionTimeoutMin']) {
    if (document.getElementById(k)) document.getElementById(k).value = cfg[k];
  }
  if (document.getElementById('overlayPosition')) document.getElementById('overlayPosition').value = cfg.overlayPosition;
}
async function save() {
  const body = {};
  for (const k of ['alertThreshold','logThreshold','sampleIntervalMs','overlayAutoDismissMs','sessionTimeoutMin']) {
    const v = document.getElementById(k).value;
    if (v !== '') body[k] = Number(v);
  }
  const pos = document.getElementById('overlayPosition').value.trim();
  if (pos) body.overlayPosition = pos;
  const msg = document.getElementById('msg');
  try {
    const res = await fetch('/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': document.getElementById('adminKey').value },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    msg.textContent = 'Saved ✓ — phones will pick this up automatically.';
    msg.className = '';
    load();
  } catch (e) {
    msg.textContent = 'Failed: ' + e.message;
    msg.className = 'err';
  }
}
load();
</script>
</body>
</html>
