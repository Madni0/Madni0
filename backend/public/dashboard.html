<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Shield — Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #0f1117; color: #e5e7eb; margin: 0; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 20px 28px; border-bottom: 1px solid #2a2f3d; }
  h1 { font-size: 20px; margin: 0; }
  .muted { color: #9ca3af; font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 28px 60px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .card { background: #171a23; border: 1px solid #2a2f3d; border-radius: 14px; padding: 18px; margin-top: 14px; }
  .stat b { font-size: 30px; display: block; }
  .stat span { color: #9ca3af; font-size: 12.5px; }
  .red { color: #f87171; } .amber { color: #fbbf24; } .green { color: #34d399; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #2a2f3d; white-space: nowrap; }
  th { color: #9ca3af; font-weight: 600; font-size: 12px; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .badge.ALERT { background: rgba(220,38,38,.18); color: #f87171; }
  .badge.LOG_SILENT { background: rgba(217,119,6,.18); color: #fbbf24; }
  .badge.IGNORE { background: rgba(5,150,105,.18); color: #34d399; }
  label { display: block; margin-top: 12px; font-size: 12.5px; color: #9ca3af; }
  input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 9px; border-radius: 8px; border: 1px solid #2a2f3d; background: #0f1117; color: #e5e7eb; font-size: 14px; }
  button { margin-top: 14px; padding: 10px 18px; border-radius: 8px; border: 0; background: #4f46e5; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #6366f1; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  #msg { margin-top: 10px; font-size: 13px; color: #34d399; }
  #msg.err { color: #f87171; }
  .head-links a { color: #a5b4fc; text-decoration: none; font-size: 14px; margin-left: 14px; }
  .auto { display: flex; gap: 8px; align-items: center; font-size: 13px; color: #9ca3af; }
</style>
</head>
<body>
<header>
  <h1>🛡️ AI Shield — Dashboard</h1>
  <div class="head-links"><a href="/">← Web app</a></div>
</header>
<main>
  <div class="cards">
    <div class="card stat"><b id="sTotal">–</b><span>Content analyzed</span></div>
    <div class="card stat"><b class="red" id="sAlerts">–</b><span>Alerts shown</span></div>
    <div class="card stat"><b class="amber" id="sSilent">–</b><span>Recorded silently (70–89%)</span></div>
    <div class="card stat"><b class="green" id="sAvg">–</b><span>Mean confidence</span></div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <h2 style="margin:0">Detection log</h2>
      <div style="display:flex; gap:14px; align-items:center;">
        <label class="auto" style="margin:0"><input type="checkbox" id="autoRefresh" checked /> auto-refresh</label>
        <button style="margin:0" onclick="load()">Refresh</button>
      </div>
    </div>
    <div style="overflow-x:auto; margin-top:8px;">
      <table>
        <thead><tr><th>Time</th><th>Source</th><th>Overall</th><th>Visual</th><th>Action</th></tr></thead>
        <tbody id="logRows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>Server-configured thresholds <span class="muted">(applies to Android app + web within one session)</span></h2>
    <div class="row">
      <div><label>Alert threshold (show warning ≥)</label><input id="alertThreshold" type="number" step="0.01" min="0.5" max="1" /></div>
      <div><label>Silent-log threshold (record internally ≥)</label><input id="logThreshold" type="number" step="0.01" min="0.1" max="1" /></div>
      <div><label>Sample interval (ms)</label><input id="sampleIntervalMs" type="number" step="100" min="300" max="60000" /></div>
    </div>
    <div class="row">
      <div><label>Overlay auto-dismiss (ms)</label><input id="overlayAutoDismissMs" type="number" step="500" min="1500" max="60000" /></div>
      <div><label>Overlay position</label><input id="overlayPosition" placeholder="top | bottom" /></div>
      <div><label>Session auto-stop (minutes, 0 = off)</label><input id="sessionTimeoutMin" type="number" min="0" max="720" /></div>
    </div>
    <button onclick="saveConfig()">Save config</button>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>Admin key</h2>
    <input id="adminKey" value="dev-admin-key" />
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const key = () => $('adminKey').value;

async function load() {
  let logs = [];
  try {
    const res = await fetch('/logs?limit=500', { headers: { 'x-admin-key': key() } });
    if (res.ok) logs = await res.json();
  } catch (e) {}

  logs.sort((a, b) => (b.receivedAt || 0) - (a.receivedAt || 0));
  const alerts = logs.filter(l => l.action === 'ALERT');
  const silent = logs.filter(l => l.action === 'LOG_SILENT');
  $('sTotal').textContent = logs.length;
  $('sAlerts').textContent = alerts.length;
  $('sSilent').textContent = silent.length;
  $('sAvg').textContent = logs.length
    ? Math.round(logs.reduce((a, l) => a + (l.overall || 0), 0) / logs.length * 100) + '%'
    : '–';

  $('logRows').innerHTML = logs.length ? logs.slice(0, 100).map(l => {
    const pct = Math.round((l.overall || 0) * 100);
    const cls = pct >= 90 ? 'red' : pct >= 70 ? 'amber' : 'green';
    const t = new Date(l.receivedAt || l.timeMs || Date.now()).toLocaleString();
    const src = (l.source ? l.source + ' · ' : '') + (l.packageName || '—');
    return `<tr>
      <td class="muted">${t}</td>
      <td>${src}</td>
      <td class="${cls}"><b>${pct}%</b></td>
      <td class="muted">${Math.round((l.visual || 0) * 100)}%</td>
      <td><span class="badge ${l.action || ''}">${(l.action || '—').replace('_', ' ')}</span></td>
    </tr>`;
  }).join('') : '<tr><td colspan="5" class="muted">No detections yet — run a scan in the <a href="/">web app</a>.</td></tr>';
}

async function loadConfig() {
  try {
    const cfg = await (await fetch('/config')).json();
    for (const k of ['alertThreshold', 'logThreshold', 'sampleIntervalMs', 'overlayAutoDismissMs', 'sessionTimeoutMin']) {
      if ($(k)) $(k).value = cfg[k];
    }
    if ($('overlayPosition')) $('overlayPosition').value = cfg.overlayPosition;
  } catch (e) {}
}

async function saveConfig() {
  const body = {};
  for (const k of ['alertThreshold', 'logThreshold', 'sampleIntervalMs', 'overlayAutoDismissMs', 'sessionTimeoutMin']) {
    const v = $(k).value;
    if (v !== '') body[k] = Number(v);
  }
  const pos = $('overlayPosition').value.trim();
  if (pos) body.overlayPosition = pos;
  const msg = $('msg');
  try {
    const res = await fetch('/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': key() },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    msg.textContent = 'Saved ✓ — every connected device picks this up automatically.';
    msg.className = '';
    loadConfig();
  } catch (e) {
    msg.textContent = 'Failed: ' + e.message;
    msg.className = 'err';
  }
}

let poll = null;
$('autoRefresh').addEventListener('change', e => {
  if (poll) { clearInterval(poll); poll = null; }
  if (e.target.checked) poll = setInterval(load, 5000);
});
poll = setInterval(load, 5000);
load();
loadConfig();
</script>
</body>
</html>
